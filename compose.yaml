services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  provider-simulator:
    image: ghcr.io/fintech-dev-lab/internship-provider-simulator:v0.2.0
    environment:
      CALLBACK_URL: http://candidate-service:8080/receipts
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  candidate-service:
    build:
      context: .
      dockerfile: FintechTask.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      PROVIDER_URL: http://provider-simulator:8081
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - candidate-data:/app/data
    restart: unless-stopped

volumes:
  postgres_data:
  candidate-data: